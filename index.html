<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WORLD BANK - 보안 게이트웨이 & 메인 허브</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a14;
            --card-bg: rgba(14, 23, 42, 0.85);
            --card-border: rgba(0, 210, 255, 0.25);
            --neon-blue: #00d2ff;
            --neon-glow: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --gold-accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 85px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.15) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(30, 58, 95, 0.3) 0%, transparent 55%);
            background-attachment: fixed;
        }

        /* 상단 아키텍처 및 탭 전환 카드 */
        .app-header {
            padding: 20px 16px 10px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .header-card {
            background: rgba(10, 18, 34, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            padding: 18px 16px;
            display: flex;
            gap: 12px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        .header-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 6px;
        }

        .header-left .title-badge {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .header-left h2 {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: -0.2px;
        }

        .header-tabs {
            flex: 1.5;
            display: flex;
            gap: 8px;
        }

        .vertical-tab {
            flex: 1;
            background: rgba(18, 29, 51, 0.95);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            color: var(--text-sub);
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .vertical-tab .tab-num {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .vertical-tab .tab-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .vertical-tab.active {
            background: linear-gradient(180deg, #00d2ff, #0072ff);
            color: #ffffff;
            border-color: #00d2ff;
            box-shadow: 0 0 18px var(--neon-glow);
        }

        /* 뷰 전환 컨테이너 */
        .view-content {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            padding: 0 16px;
        }

        .view-content.active {
            display: block;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 1. 보안 게이트웨이 뷰 */
        .gateway-banner {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            padding: 11px 16px;
            text-align: center;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--gold-accent);
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .gateway-title-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .gateway-title-section h2 {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .gateway-title-section p {
            font-size: 12.5px;
            color: var(--text-sub);
        }

        .console-box {
            background: #070e1a;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 18px;
            padding: 18px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.1);
            font-family: 'Courier New', Courier, monospace;
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .console-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ef4444;
            font-size: 12.5px;
            font-weight: 700;
            font-family: 'Pretendard', sans-serif;
        }

        .console-time {
            color: var(--neon-blue);
            font-size: 12.5px;
            font-weight: 600;
        }

        .console-logs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .log-item {
            color: #cbd5e1;
        }

        .log-item span.highlight {
            color: var(--neon-blue);
        }

        .log-item span.status {
            color: #10b981;
        }

        /* 2. HK 통합 메인 허브 뷰 */
        .hub-title {
            text-align: center;
            margin: 10px 0 20px;
        }

        .hub-title h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .hub-title p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .menu-card:hover, .menu-card:active {
            transform: translateY(-2px);
            background: rgba(22, 38, 68, 0.95);
            border-color: var(--neon-blue);
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.25);
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-blue);
            font-size: 18px;
            flex-shrink: 0;
        }

        .menu-info h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 3px;
        }
